# Thor platform pyproject.toml — Jetson AGX Thor (aarch64, CUDA 13, Python 3.12)
# This is a self-contained config with no platform markers needed.

[build-system]
requires = ["setuptools>=83.0.0", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "gr00t"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "albumentations==1.4.18",
    "diffusers==0.36.0.dev0",
    "dm-tree==0.1.8",
    "huggingface-hub[cli]",
    "jsonlines==4.0.0",
    "lmdb==1.7.5",
    "msgpack==1.2.1",
    "msgpack-numpy==0.4.8",
    "opencv-python-headless>=4.5,<4.13",
    "pandas==2.2.3",
    "peft==0.17.1",
    "termcolor==3.2.0",
    "torch==2.10.0",
    "triton==3.5.0",
    "torchvision==0.25.0",
    "transformers==4.57.6+pgfr.security1",
    "accelerate==1.12.0+pgfr.security1",
    "tyro==0.9.17",
    "click==8.2.1",
    "datasets==3.6.0",
    "cryptography>=50.0.0",
    "einops==0.8.1",
    "gymnasium==1.2.2",
    "matplotlib==3.10.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "scipy==1.15.3",
    "wandb==0.30.0",
    "opentelemetry-api==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "opentelemetry-exporter-otlp-proto-http==1.43.0",
    "pyzmq==27.0.1",
    # TorchCodec is intentionally a post-sync overlay: install_deps.sh requires
    # the exact checksum-verified cp312 aarch64 wheel qualified on Thor.
    # Keep these as direct pins: the Jetson Thor torch wheel does not bundle these runtime libs,
    # and we want them installed even if torch's transitive dependency metadata changes upstream.
    # Revisit if the Jetson AI Lab torch packages start vendoring them or declaring them reliably.
    "nvidia-cudnn-cu13==9.19.1.2",
    "nvidia-cudss-cu13==0.7.1.6",
    "flash-attn==2.8.4",
    "onnx>=1.23.0",
    "onnxscript",
    "tensorrt==10.15.1.29",
    # Declare transitive NVIDIA runtimes explicitly to preserve their index and ABI.
    "cuda-toolkit==13.1.1",
    "nvidia-cublas==13.2.1.1",
    "tensorrt-cu13==10.15.1.29",
    "tensorrt-cu13-bindings==10.15.1.29",
    "tensorrt-cu13-libs==10.15.1.29",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ipython",
    "pytest",
    "pytest-timeout",
    "build",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gr00t*"]

[tool.uv]
# Security floors for transitive dependencies in the Thor environment.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "idna>=3.18",
    "pillow>=12.3.0",
    "setuptools>=83.0.0",
]
build-constraint-dependencies = ["setuptools>=83.0.0"]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.10.0", "numpy==1.26.4", "triton==3.5.0"]

[tool.uv.sources]
accelerate = { path = "wheels/security/accelerate-1.12.0+pgfr.security1-py3-none-any.whl" }
transformers = { path = "wheels/security/transformers-4.57.6+pgfr.security1-py3-none-any.whl" }
cuda-toolkit = [{ index = "nvidia-pypi" }]
nvidia-cublas = [{ index = "nvidia-pypi" }]
nvidia-cudnn-cu13 = [{ index = "nvidia-pypi" }]
nvidia-cudss-cu13 = [{ index = "nvidia-pypi" }]
tensorrt = [{ index = "nvidia-pypi" }]
tensorrt-cu13 = [{ index = "nvidia-pypi" }]
tensorrt-cu13-bindings = [{ index = "nvidia-pypi" }]
tensorrt-cu13-libs = [{ index = "nvidia-pypi" }]
torch = [{ index = "jetson-sbsa-cu130" }]
torchvision = [{ index = "jetson-sbsa-cu130" }]
triton = [{ index = "jetson-sbsa-cu130" }]
flash-attn = [{ index = "jetson-sbsa-cu130" }]
diffusers = [{ index = "jetson-sbsa-cu130" }]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
    "gpu: tests that require a GPU",
    "multigpu: tests that require multiple GPUs and use all visible GPUs",
]
# Include fixture setup/teardown in JUnit <testcase time="..."> so duration
# reports reflect real wall-clock time instead of call-only.
junit_duration_report = "total"

[tool.ruff]
line-length = 100
# Thor ships Python 3.12 (see requires-python above) — keep Ruff aligned
# so rule behaviour matches the interpreter actually used on device.
target-version = "py312"
src = ["gr00t"]
exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".vscode",
    ".venv",
    "dist",
    "logs",
    "*.ipynb",
    "external_dependencies",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = false
split-on-trailing-comma = false
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[[tool.uv.index]]
name = "nvidia-pypi"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "jetson-sbsa-cu130"
url = "https://pypi.jetson-ai-lab.io/sbsa/cu130/+simple"
explicit = true
