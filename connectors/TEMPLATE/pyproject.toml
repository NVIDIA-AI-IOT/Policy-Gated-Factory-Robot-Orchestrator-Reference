[project]
name = "my-connector"                 # RENAME
version = "0.1.0"
license = { text = "Apache-2.0" }
description = "TEMPLATE — wrap <your system> as a Policy-Gated Factory Robot Orchestrator Reference connector"
requires-python = ">=3.10"
dependencies = ["pgfr-connector-sdk"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_connector"]       # RENAME

[tool.uv.sources]                     # local dev: resolve the SDK from the monorepo
pgfr-connector-sdk = { path = "../../packages/connector-sdk", editable = true }
