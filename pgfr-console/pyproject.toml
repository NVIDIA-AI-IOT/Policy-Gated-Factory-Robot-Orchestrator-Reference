[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgfr-console"
version = "0.1.0"
license = { text = "Apache-2.0" }
description = "Policy-Gated Factory Robot Orchestrator Reference console — read-only live topology, mission replay, and system health over the floor seam"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pgfr-console = "pgfr_console.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pgfr_console"]
# Ship the SPA assets inside the wheel (else an installed console 500s on /).
force-include = { "src/pgfr_console/static" = "pgfr_console/static" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
