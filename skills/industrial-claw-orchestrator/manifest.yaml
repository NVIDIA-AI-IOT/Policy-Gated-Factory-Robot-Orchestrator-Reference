name: industrial-claw-orchestrator
version: 1.0.0
description: >
  Turn a vague floor goal ("tidy the conveyor, then shelve the tote") into safe,
  verified floor procedure: sort cubes to matching tote compartments with the
  closer arm, haul the tote to the rack, verify every step by camera + physics.
owner: mmallick

requires_tools:
  - floor_state
  - perceive
  - dispatch_task
  - verify

allowed_actions:
  - move
  - pick_and_place
  - inspect

done_criteria: >
  Conveyor empty, one cube per matching tote compartment, tote resting on
  rack_1 — confirmed by a verified pick_and_place result and a rack-camera
  verify answering yes.
