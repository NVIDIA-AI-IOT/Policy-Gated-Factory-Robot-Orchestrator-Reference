[project]
name = "pgfr-conformance"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
description = "Policy-Gated Factory Robot Orchestrator Reference conformance kit — the certification bar for floor-seam implementations"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pyyaml>=6.0,<7"]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
pgfr-conformance = "pgfr_conformance.kit:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgfr_conformance"]
