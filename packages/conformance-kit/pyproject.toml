[project]
name = "ic-conformance"
version = "0.1.0"
license = { text = "Apache-2.0" }
description = "Industrial Claw conformance kit — the certification bar for floor-seam implementations"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pyyaml>=6.0,<7"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
ic-conformance = "ic_conformance.kit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ic_conformance"]
