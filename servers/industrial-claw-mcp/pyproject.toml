[project]
name = "ic-mcp"
version = "0.1.0"
license = { text = "Apache-2.0" }
description = "Industrial Claw MCP server — the floor Seam's governed tools over MCP"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
ic-mcp = "ic_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ic_mcp"]
