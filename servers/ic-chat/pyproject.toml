[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ic-chat"
version = "0.1.0"
license = { text = "Apache-2.0" }
description = "Industrial Claw chat gateway — swappable model backends drive the cell through the seam tool loop, journaled"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0"]

[project.scripts]
ic-chat = "ic_chat.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ic_chat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
