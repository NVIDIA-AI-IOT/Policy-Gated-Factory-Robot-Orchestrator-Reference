[project]
name = "pgfr-mcp"
version = "0.1.0"
license = { text = "Apache-2.0" }
description = "Policy-Gated Factory Robot Orchestrator Reference MCP server — the floor Seam's governed tools over MCP"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
pgfr-mcp = "pgfr_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgfr_mcp"]
