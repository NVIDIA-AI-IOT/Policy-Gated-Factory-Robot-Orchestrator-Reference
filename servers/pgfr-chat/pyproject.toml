[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "pgfr-chat"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
description = "Policy-Gated Factory Robot Orchestrator Reference chat gateway — swappable model backends drive the cell through the seam tool loop, journaled"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "aiohttp>=3.14.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0"]

[project.scripts]
pgfr-chat = "pgfr_chat.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pgfr_chat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
# Retain the reviewed CA bundle floor when resolving transitive HTTP dependencies.
constraint-dependencies = ["certifi>=2026.10.23"]
