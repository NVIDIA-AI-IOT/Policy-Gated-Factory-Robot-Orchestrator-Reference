[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgfr-workflows"
version = "0.1.0"
license = { text = "Apache-2.0" }
description = "Policy-Gated Factory Robot Orchestrator Reference workflow builder + runner — compose MCP tool verbs into versioned, gated, journaled skills"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6",
    "pgfr-chat",  # model backends for the NL authoring assistant
]

[tool.uv.sources]
pgfr-chat = { path = "../pgfr-chat", editable = true }

[project.optional-dependencies]
dev = [
    "numpy==1.26.4",  # hardware-free deterministic GR00T relay contracts
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pgfr-workflows = "pgfr_workflows.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pgfr_workflows"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
