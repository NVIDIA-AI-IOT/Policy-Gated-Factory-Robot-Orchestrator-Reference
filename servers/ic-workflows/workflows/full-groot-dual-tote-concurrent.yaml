name: full-groot-dual-tote-concurrent
version: 1.0.0
description: >-
  Readiness-gated fixed layout-3 demonstration: execute the validated mixed
  Order744 pair sequence through two independent B=1 GR00T servers, verify
  each tote separately after every pair, then haul both totes serially to the
  rack. Requires IC_GROOT_PARALLEL_ENABLED=1 and
  IC_GROOT_FLEXIBLE_ORDER=1; otherwise use full-groot-dual-tote.
owner: policy-gated-factory-robot-orchestrator-reference
steps:
  - tool: dispatch_parallel
    args:
      moves:
        - endpoint: franka_left
          color: blue
          source: conveyor_1
          destination: tote_blue
          backend: groot
        - endpoint: franka_right
          color: green
          source: conveyor_2
          destination: tote_green
          backend: groot
  - tool: check_predicate
    args:
      predicate: the blue cylinder is inside the blue compartment of the left tote
      region: tote
    max_retries: 1
  - tool: check_predicate
    args:
      predicate: the green brick is inside the green compartment of the right tote
      region: tote_r
    max_retries: 1
  - tool: dispatch_parallel
    args:
      moves:
        - endpoint: franka_left
          color: green
          source: conveyor_1
          destination: tote_green
          backend: groot
        - endpoint: franka_right
          color: red
          source: conveyor_2
          destination: tote_red
          backend: groot
  - tool: check_predicate
    args:
      predicate: the green brick is inside the green compartment of the left tote
      region: tote
    max_retries: 1
  - tool: check_predicate
    args:
      predicate: the red cube is inside the red compartment of the right tote
      region: tote_r
    max_retries: 1
  - tool: dispatch_parallel
    args:
      moves:
        - endpoint: franka_left
          color: red
          source: conveyor_1
          destination: tote_red
          backend: groot
        - endpoint: franka_right
          color: blue
          source: conveyor_2
          destination: tote_blue
          backend: groot
  - tool: check_predicate
    args:
      predicate: the red cube is inside the red compartment of the left tote
      region: tote
    max_retries: 1
  - tool: check_predicate
    args:
      predicate: the blue cylinder is inside the blue compartment of the right tote
      region: tote_r
    max_retries: 1
  - tool: dispatch_task
    args:
      action: pick_and_place
      endpoint: mobilebot
      object_id: tote
      target_id: rack_1
  - tool: check_predicate
    args:
      predicate: the left tote is on rack_1
      region: rack_1
    max_retries: 1
  - tool: dispatch_task
    args:
      action: pick_and_place
      endpoint: mobilebot
      object_id: tote_r
      target_id: rack_1
  - tool: check_predicate
    args:
      predicate: the right tote is on rack_1
      region: rack_1
    max_retries: 1
done_criteria: >-
  The explicitly enabled blue/green, green/red, and red/blue Order744 pairs
  each physics-verify independent B=1 inference, fresh VLM evidence verifies
  every tote compartment, and both totes are physically hauled and visually
  verified on rack_1.
