<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Industrial Claw reference deployment</title>
  <desc id="desc">IC Console and agent harnesses connect through MCP to IC Spine on the brain host. IC Spine uses a perception VLM and ROS 2 to control an Isaac Sim cell. Two GR00T serving processes load the same checkpoint and connect to the two arm executor through a validated bridge.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9f7}.host{fill:#fff;stroke:#879489;stroke-width:2}.core{fill:#e9f5df;stroke:#4b9300;stroke-width:2.5}.box{fill:#fff;stroke:#a9b3aa;stroke-width:1.8}.learned{fill:#f1f7ea;stroke:#76a842;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#1f2721}.hosttitle{font:700 21px Arial,sans-serif;fill:#344138}.label{font:700 17px Arial,sans-serif;fill:#263029}.small{font:14px Arial,sans-serif;fill:#556158}.line{stroke:#4b9300;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#6d786f;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow2)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4b9300"/></marker>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6d786f"/></marker>
  </defs>
  <rect class="bg" width="1440" height="820"/>
  <text class="title" x="48" y="55">Industrial Claw reference deployment</text>
  <text class="small" x="48" y="82">Two-host learned-motion configuration with a shared policy checkpoint</text>

  <rect class="host" x="40" y="120" width="650" height="620" rx="20"/>
  <text class="hosttitle" x="70" y="160">Brain host</text>
  <text class="small" x="70" y="184">Reasoning, assurance, perception, policy serving, and operator services</text>

  <rect class="box" x="75" y="220" width="250" height="92" rx="14"/>
  <text class="label" x="200" y="254" text-anchor="middle">IC Console</text>
  <text class="small" x="200" y="280" text-anchor="middle">chat · topology · missions · telemetry</text>

  <rect class="box" x="400" y="220" width="250" height="92" rx="14"/>
  <text class="label" x="525" y="254" text-anchor="middle">Agent harness</text>
  <text class="small" x="525" y="280" text-anchor="middle">OpenClaw · Codex · Claude Code · MCP</text>

  <rect class="core" x="150" y="360" width="430" height="125" rx="16"/>
  <text class="label" x="365" y="398" text-anchor="middle">IC Spine</text>
  <text class="small" x="365" y="426" text-anchor="middle">policy · dispatch · verification · journal</text>
  <text class="small" x="365" y="452" text-anchor="middle">nine MCP tools and versioned floor API</text>

  <rect class="box" x="75" y="540" width="250" height="105" rx="14"/>
  <text class="label" x="200" y="576" text-anchor="middle">Perception VLM</text>
  <text class="small" x="200" y="602" text-anchor="middle">Nemotron Nano 12B VL</text>
  <text class="small" x="200" y="625" text-anchor="middle">fresh-frame visual evidence</text>

  <rect class="learned" x="400" y="525" width="250" height="135" rx="14"/>
  <text class="label" x="525" y="558" text-anchor="middle">Shared GR00T checkpoint</text>
  <text class="small" x="525" y="584" text-anchor="middle">left policy process + relay</text>
  <text class="small" x="525" y="609" text-anchor="middle">right policy process + relay</text>
  <text class="small" x="525" y="634" text-anchor="middle">one model · two serving instances</text>

  <path class="line" d="M325 266 H400"/><text class="small" x="362" y="250" text-anchor="middle">session</text>
  <path class="line" d="M525 312 V360"/><text class="small" x="548" y="340">MCP</text>
  <path class="line" d="M200 540 V486"/><text class="small" x="215" y="516">frames</text>
  <path class="line" d="M525 525 V486"/>

  <rect class="host" x="750" y="120" width="650" height="620" rx="20"/>
  <text class="hosttitle" x="780" y="160">Simulation host</text>
  <text class="small" x="780" y="184">Isaac Sim physics, cameras, robot execution, and ROS 2 bridge</text>

  <rect class="box" x="800" y="230" width="550" height="125" rx="16"/>
  <text class="label" x="1075" y="270" text-anchor="middle">Isaac Sim reference cell</text>
  <text class="small" x="1075" y="298" text-anchor="middle">two Franka arms · AMR · conveyor · totes · rack</text>
  <text class="small" x="1075" y="324" text-anchor="middle">camera, floor-state, feedback, and result publishers</text>

  <rect class="core" x="800" y="430" width="250" height="130" rx="16"/>
  <text class="label" x="925" y="470" text-anchor="middle">ROS 2 cell boundary</text>
  <text class="small" x="925" y="498" text-anchor="middle">command · result · feedback</text>
  <text class="small" x="925" y="524" text-anchor="middle">floor state · camera streams</text>

  <rect class="learned" x="1100" y="430" width="250" height="130" rx="16"/>
  <text class="label" x="1225" y="470" text-anchor="middle">GR00T executor</text>
  <text class="small" x="1225" y="498" text-anchor="middle">paired-arm transaction</text>
  <text class="small" x="1225" y="524" text-anchor="middle">tracking · grasp · release · settle</text>

  <rect class="box" x="875" y="625" width="400" height="78" rx="14"/>
  <text class="label" x="1075" y="657" text-anchor="middle">Scripted/RMPFlow baseline</text>
  <text class="small" x="1075" y="683" text-anchor="middle">scene and contract validation path</text>

  <path class="line" d="M1075 355 V430"/>
  <path class="line" d="M1050 495 H1100"/>
  <path class="dash" d="M650 592 C760 592 990 592 1100 515"/>
  <text class="small" x="820" y="580">validated loopback bridge</text>
  <path class="line" d="M580 422 C690 422 720 485 800 485"/>
  <text class="small" x="692" y="407">ROS 2</text>
  <path class="dash" d="M925 560 C925 602 970 625 1015 625"/>
</svg>
