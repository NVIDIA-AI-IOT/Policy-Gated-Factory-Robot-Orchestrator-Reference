  artifact_manifest: reference/groot/models/manifest.yaml
  checkpoint:
    source: locally_trained_by_user
    required_environment: PGFR_GROOT_MODEL_ROOT
    metadata: pgfr_checkpoint.json
    checksums: SHA256SUMS
    fingerprint: sha256_of_sha256sums_bytes
    export_helper: ops/export-groot-checkpoint.py
    verification_helper: ops/verify-groot-models.sh
  embodiment_tag: OXE_DROID_RELATIVE_EEF_RELATIVE_JOINT
  serving_instances:
    franka_left:
      policy_port: 5592
      relay_port: 5641
    franka_right:
      policy_port: 5593
      relay_port: 5642
  thor_shared_profiles:
    installer: ops/install-groot-thor-shared-profiles.sh
    model_root: explicit_local_checkpoint_export_path
    authoritative_state_root: ~/.local/share/pgfr-spine/groot
    target: pgfr-groot-shared-stack.target
    installed_files:
      - shared-left.env
      - shared-right.env
      - pgfr-groot-shared-stack.target
    starts_services: false
  simulation_host_bridge:
    transport: ssh_loopback_forwards
    helper: ops/groot-two-host-bridge.py
    installer: ops/install-groot-two-host-bridge.sh
    unit: ops/systemd/simulation-host/pgfr-groot-two-host-bridge.service
