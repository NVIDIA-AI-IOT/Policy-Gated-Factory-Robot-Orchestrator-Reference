name: Clean-clone validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Build and validate standalone package artifacts
        run: python ops/validate-packages.py

  model-dependency-security:
    runs-on: ubuntu-24.04
    env:
      WANDB_MODE: offline
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: thor
            python: "3.12.3"
            manifest: manifest.json
            torch: "2.10.0+cpu"
            torchvision: "0.25.0+cpu"
          - profile: training
            python: "3.10"
            manifest: manifest-training.json
            torch: "2.7.1+cpu"
            torchvision: "0.22.1+cpu"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Build pinned security wheels
        run: |
          python reference/groot/security/build_security_wheels.py \
            --manifest reference/groot/security/${{ matrix.manifest }} \
            --output-dir "$RUNNER_TEMP/security-wheels"

      - name: Install CPU regression environment
        run: |
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/security-tests"
          uv pip install --python "$RUNNER_TEMP/security-tests/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==${{ matrix.torch }}" "torchvision==${{ matrix.torchvision }}"
          uv pip install --python "$RUNNER_TEMP/security-tests/bin/python" \
            "$RUNNER_TEMP/security-wheels/"*.whl \
            pytest==9.0.3 numpy==1.26.4 pillow==12.3.0 sacremoses==0.1.1 \
            huggingface-hub==0.36.2 tokenizers==0.22.2 safetensors==0.7.0 setuptools==83.0.0 \
            wandb==0.30.0 click==8.2.1 googleapis-common-protos==1.75.4 \
            opentelemetry-api==1.43.0 opentelemetry-sdk==1.43.0 \
            opentelemetry-proto==1.43.0 opentelemetry-exporter-otlp-proto-common==1.43.0 \
            opentelemetry-exporter-otlp-proto-http==1.43.0 opentelemetry-semantic-conventions==0.64b0
          uv pip check --python "$RUNNER_TEMP/security-tests/bin/python"

      - name: Exercise security boundaries and normal model loading
        run: |
          "$RUNNER_TEMP/security-tests/bin/python" -m unittest discover \
            -s reference/groot/security/tests -p 'test_*.py'
          "$RUNNER_TEMP/security-tests/bin/python" -m pytest -q \
            reference/groot/security/tests/transformers_regression.py
          "$RUNNER_TEMP/security-tests/bin/python" \
            reference/groot/security/tests/transformers_kernel_trust.py
          "$RUNNER_TEMP/security-tests/bin/python" \
            reference/groot/security/tests/transformers_qwen_smoke.py "$RUNNER_TEMP/qwen-smoke"

  hardware-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Validate shell sources
        run: |
          for script in ops/*.sh; do bash -n "$script"; done
          bash -n reference/groot/thor/install_deps.sh

      - name: Rebuild and verify patched model dependencies
        run: |
          python reference/groot/security/build_security_wheels.py \
            --manifest reference/groot/security/manifest.json \
            --output-dir reference/groot/thor/wheels/security
          python -m unittest discover -s reference/groot/security/tests -p 'test_build*.py'

      - name: Validate Python lock metadata
        run: |
          for project in pgfr-spine pgfr-console servers/pgfr-chat servers/pgfr-workflows \
            servers/policy-gated-factory-robot-orchestrator-reference-mcp; do
            uv lock --check --project "$project"
          done
          uv lock --check --project reference/groot/thor

      - name: Validate locked Node installation
        run: |
          npm ci
          npm ls --all
          npm audit --audit-level=high
          OPENCLAW_CONFIG_PATH="$PWD/ops/openclaw.template.json" \
            ./node_modules/.bin/openclaw config validate
          rendered_config="$RUNNER_TEMP/openclaw-rendered.json"
          sed 's#__MCP_COMMAND__#/usr/bin/true#' \
            ops/openclaw.template.json > "$rendered_config"
          OPENCLAW_CONFIG_PATH="$rendered_config" \
            ./node_modules/.bin/openclaw config validate
          npm test

      - name: Validate PGFR Spine
        run: |
          uv sync --frozen --extra dev --project pgfr-spine
          uv run --frozen --project pgfr-spine ruff check pgfr-spine skills ops/validate-packages.py reference/groot/security
          (cd pgfr-spine && uv run --frozen mypy)
          uv sync --frozen --extra dev --extra ros --project pgfr-spine
          uv run --frozen --extra ros --project pgfr-spine pytest -q pgfr-spine/tests
          uv run --frozen --project pgfr-spine policy_gated_factory_robot_orchestrator_reference --help

      - name: Validate PGFR Chat
        run: |
          uv sync --frozen --extra dev --project servers/pgfr-chat
          uv run --frozen --project servers/pgfr-chat pytest -q servers/pgfr-chat/tests

      - name: Validate PGFR Workflows
        run: |
          uv sync --frozen --extra dev --project servers/pgfr-workflows
          uv run --frozen --project servers/pgfr-workflows pytest -q servers/pgfr-workflows/tests

      - name: Validate PGFR Console
        run: |
          uv sync --frozen --extra dev --project pgfr-console
          uv run --frozen --project pgfr-console pytest -q pgfr-console/tests

      - name: Validate MCP server
        run: |
          uv sync --frozen --extra dev --project servers/policy-gated-factory-robot-orchestrator-reference-mcp
          uv run --frozen --project servers/policy-gated-factory-robot-orchestrator-reference-mcp pytest -q servers/policy-gated-factory-robot-orchestrator-reference-mcp/tests

      - name: Validate hardware-free GR00T deployment contracts
        run: |
          uv run --frozen --project servers/pgfr-workflows pytest -q \
            reference/groot/tests/test_cont24_v36_runtime.py \
            reference/groot/tests/test_native_droid_relay_batch2.py \
            reference/groot/tests/test_two_host_bridge.py

      - name: Validate dataset creation and training preflight
        run: |
          # Reuse the reviewed lock for CPU-only fixtures without installing the GPU stack.
          uv export --frozen --extra dev \
            --project reference/groot/thor \
            --no-emit-project --no-hashes --no-annotate --no-header \
            --no-emit-package transformers --no-emit-package accelerate \
            --format requirements-txt --output-file "$RUNNER_TEMP/pipeline-constraints.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/pipeline-tests"
          uv pip install --python "$RUNNER_TEMP/pipeline-tests/bin/python" \
            --constraint "$RUNNER_TEMP/pipeline-constraints.txt" pytest numpy pandas pyarrow scipy
          "$RUNNER_TEMP/pipeline-tests/bin/python" -m pytest -q \
            reference/groot/groot_n1_7_pgfr_pipeline/tests

      - name: Validate deployment contracts
        run: |
          uv run --frozen --project servers/pgfr-workflows pytest -q \
            ops/test_deployment_contracts.py \
            ops/test_groot_sim_host_contract.py \
            ops/test_pgfr_gpu_exporter.py \
            ops/test_isaac_sim_acceptance.py \
            ops/test_isaac_sim_workstation.py \
            pgfr-spine/tests/unit/test_isaac_lifecycle_contract.py
          python -m compileall -q pgfr-spine/src servers pgfr-console/src ops
